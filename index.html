<!DOCTYPE html>
<html lang="sq">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Albania</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}


/* VIDEO SFONDI */

.video-bg{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:0;
}


/* ERRËSIMI */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.45);
    z-index:1;
}


/* TEKSTI */

.content{

    position:relative;
    z-index:2;

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;
    text-align:center;

    font-family:
    "Helvetica Neue",
    Arial,
    sans-serif;

}


h1{

    font-size:80px;
    font-weight:300;

    letter-spacing:15px;

    text-shadow:
    0 5px 30px rgba(0,0,0,.8);

}


p{

    margin-top:20px;

    font-size:25px;

    letter-spacing:8px;

    opacity:.9;

}



/* TELEFON */

@media(max-width:600px){

h1{
    font-size:45px;
    letter-spacing:8px;
}

p{
    font-size:18px;
}

}


</style>

</head>


<body>


<video class="video-bg"
autoplay
muted
loop
playsinline
preload="auto">

<source src="videos/background.mp4" type="video/mp4">

</video>



<div class="overlay"></div>



<div class="content">

<div>

<h1>HESHT</h1>

<p>ALBANIA</p>

</div>

</div>



</body>

</html>
