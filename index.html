<!DOCTYPE html>
<html lang="sq">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title></title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


html, body{

    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;

}


/* VIDEO SFONDI */

.video-bg{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:0;

}



/* ERRËSIM I LEHTË */

.overlay{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,0.25);

    z-index:1;

}



/* TEKSTI POSHTË SHQIPONJËS */

.content{

    position:absolute;

    z-index:2;

    bottom:8%;

    left:0;

    width:100%;


    display:flex;

    justify-content:center;


    text-align:center;


    font-family:
    Arial,
    sans-serif;

}



/* SLOGANI */

h1{

    font-size:55px;

    font-weight:800;

    letter-spacing:8px;


    color:#050505;


    text-shadow:

    0 0 5px white,

    0 0 15px white,

    0 0 30px white;


    animation:levizje 4s ease-in-out infinite;

}



/* ANIMACIONI */

@keyframes levizje{


    0%{

        transform:translateY(10px);

        opacity:.8;

    }


    50%{

        transform:translateY(-8px);

        opacity:1;

    }


    100%{

        transform:translateY(10px);

        opacity:.8;

    }


}



/* TELEFON */

@media(max-width:600px){


h1{

    font-size:32px;

    letter-spacing:4px;

}


.content{

    bottom:10%;

}


}



</style>


</head>


<body>



<video class="video-bg"
autoplay
muted
loop
playsinline
preload="auto">


<source src="videos/background.mp4" type="video/mp4">


</video>



<div class="overlay"></div>



<div class="content">


<h1>
GUXO, BËJ, HESHT!
</h1>


</div>



</body>

</html>
