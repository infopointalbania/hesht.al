<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hesht Albania</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}


/* VIDEO SFONDI */
.video-bg{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
}


/* errësim i lehtë mbi video */
.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.35);
    z-index:-1;
}


/* përmbajtja */
.content{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    text-align:center;
    font-family:Arial, sans-serif;
}


h1{
    font-size:60px;
    letter-spacing:5px;
    text-shadow:0 5px 20px black;
}


p{
    font-size:22px;
    margin-top:15px;
}


</style>

</head>

<body>


<video class="video-bg" autoplay muted loop playsinline>
    <source src="videos/background.mp4" type="video/mp4">
</video>


<div class="overlay"></div>


<div class="content">

    <div>
        <h1>HESHT</h1>
        <p>Albania</p>
    </div>

</div>


</body>
</html>
