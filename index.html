<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hesht Albania</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}


.flag{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;
    background-image:url("images/flag.png");
    background-size:cover;
    background-position:center;

    animation:wave 5s infinite ease-in-out;
}


/* drita mbi pëlhurë */
.flag::before{
    content:"";
    position:absolute;
    inset:-20%;
    background:
    linear-gradient(
        100deg,
        transparent 35%,
        rgba(255,255,255,.25) 50%,
        transparent 65%
    );

    animation:light 6s infinite linear;
}


/* hije valësh */
.flag::after{
    content:"";
    position:absolute;
    inset:0;

    background:
    repeating-linear-gradient(
        90deg,
        rgba(0,0,0,.20) 0px,
        transparent 35px,
        rgba(0,0,0,.20) 70px
    );

    mix-blend-mode:multiply;

    animation:cloth 3s infinite linear;
}


@keyframes wave{

0%,100%{
    transform:
    perspective(1000px)
    rotateY(-8deg)
    scale(1.05);
}

50%{
    transform:
    perspective(1000px)
    rotateY(8deg)
    scale(1.08);
}

}


@keyframes light{

from{
    transform:translateX(-100%);
}

to{
    transform:translateX(100%);
}

}


@keyframes cloth{

from{
    transform:translateX(-30px);
}

to{
    transform:translateX(30px);
}

}


</style>

</head>

<body>

<div class="flag"></div>

</body>
</html>
