<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hesht Albania</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

.flag-container {
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle, #222, #000);
}

.flag {
    width: 100vw;
    height: 100vh;
    position: relative;
    background: #e41e25;
    overflow: hidden;
    animation: wave 4s infinite ease-in-out;
}

.flag::before {
    content: "";
    position: absolute;
    width: 200%;
    height: 100%;
    background:
    linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.25),
        transparent
    );
    animation: shine 3s infinite linear;
}

.eagle {
    position: absolute;
    width: 100%;
    height: 100%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 35vw;
    color:#111;
    filter: drop-shadow(0 0 20px black);
}

@keyframes wave {
    0% {
        transform: perspective(800px) rotateY(-5deg);
    }
    50% {
        transform: perspective(800px) rotateY(5deg);
    }
    100% {
        transform: perspective(800px) rotateY(-5deg);
    }
}

@keyframes shine {
    from {
        transform: translateX(-100%);
    }
    to {
        transform: translateX(100%);
    }
}

</style>

</head>

<body>

<div class="flag-container">
    <div class="flag">
        <div class="eagle">🦅</div>
    </div>
</div>

</body>
</html>
